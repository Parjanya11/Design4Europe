# Declared here so any Netlify site built from this repo configures itself
# identically - important when moving the project between accounts.
#
# There is no build step: the site is static files at the repo root, and
# Netlify only needs to install dependencies and bundle the functions.

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------------------------------------------------------------------
# Security headers, on every response.
#
# The CSP allows only our own domain: no third-party scripts, styles,
# fonts or connections exist on this site, and this keeps it that way.
# If something new needs an outside host, add that host here on purpose.
# tools/serve.mjs applies these same headers locally, so `npm run check`
# fails on anything the policy would block in production.
#
# Note: on deploy previews this also blocks Netlify's review drawer
# script. The preview itself works; only the drawer does not appear.
# ---------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Font files never change under the same name; let browsers keep them.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
